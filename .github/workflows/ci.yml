name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# Many lanes push to main: let the running build finish and keep only the newest push
# waiting, so a busy main still gets complete runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: tidy
        run: bash etc/scripts/tidy.sh
      - name: test
        run: zig build test --summary all
      - name: test release-safe
        run: zig build test -Doptimize=ReleaseSafe

  fuzz:
    # Seeded fuzz soak with a fresh seed per run; replay a failure with -Dfuzz-seed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: seeded fuzz soak
        run: >-
          zig build test -Doptimize=ReleaseSafe -Dtest-filter=fuzz -Dfuzz-soak=50
          -Dfuzz-seed=$GITHUB_RUN_NUMBER
