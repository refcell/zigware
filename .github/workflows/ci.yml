name: ci

# About fifteen lanes push to main, faster than runs finish: the running build finishes and
# only the newest push waits behind it. Jobs time out, so a hung job cannot hold the queue.
# macOS runs in macos.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and aarch64 Linux: fibers and SIMD differ per target. Each optimize mode is
        # its own job: Debug alone takes about 20 minutes, so both in one job hit the timeout.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    # ReleaseSafe hit 50 minutes on x86 at 9d1a066 while slow tests move to nightly; lower
    # this again once runtime-telemetry's trims bring it back near 25 minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: tidy
        run: bash etc/scripts/tidy.sh
      - name: test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  fuzz:
    # Seeded fuzz soak with a fresh seed per run; replay a failure with -Dfuzz-seed. Each
    # minifuzz target runs its unsoaked cases, then soaks for at most 30 s.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: seeded fuzz soak
        run: >-
          zig build test -Doptimize=ReleaseSafe -Dtest-filter=fuzz -Dfuzz-soak=50
          -Dfuzz-soak-budget-s=30 -Dfuzz-seed=$GITHUB_RUN_NUMBER --summary all
