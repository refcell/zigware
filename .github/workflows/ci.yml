name: ci

# Every push to main gets its own Linux run (many lanes push concurrently, and each
# commit's result matters). macOS runs in macos.yml on the newest push only.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and aarch64 Linux: fibers and SIMD differ per target.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: tidy
        run: bash etc/scripts/tidy.sh
      - name: test
        run: zig build test --summary all
      - name: test release-safe
        run: zig build test -Doptimize=ReleaseSafe

  fuzz:
    # Seeded fuzz soak with a fresh seed per run; replay a failure with -Dfuzz-seed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: seeded fuzz soak
        run: >-
          zig build test -Doptimize=ReleaseSafe -Dtest-filter=fuzz -Dfuzz-soak=50
          -Dfuzz-seed=$GITHUB_RUN_NUMBER
