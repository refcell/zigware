name: ci

# About fifteen lanes push to main, faster than runs finish: the running build finishes and
# only the newest push waits behind it. Jobs time out, so a hung job cannot hold the queue.
# macOS runs in macos.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and aarch64 Linux: fibers and SIMD differ per target. Debug runs every
        # package in one job. ReleaseSafe splits in two: consensus and glue compile and run
        # for about 20 minutes, the rest about as long, and one job held both past 40.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        group: [debug, release-consensus-glue, release-rest]
        include:
          - group: debug
            optimize: Debug
            steps: test
          - group: release-consensus-glue
            optimize: ReleaseSafe
            steps: test-consensus test-glue
          - group: release-rest
            optimize: ReleaseSafe
            steps: test-rest
    runs-on: ${{ matrix.os }}
    # About twice the slowest job: x86 release-rest took 37 and 32 minutes on the split's
    # first two green runs (4d433c8, 6f935ee). Caching Zig's build caches between runs
    # restored them but hit no compile step and saved no time, so CI builds cold.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: tidy
        if: matrix.group == 'debug'
        run: bash etc/scripts/tidy.sh
      - name: test
        run: zig build ${{ matrix.steps }} -Doptimize=${{ matrix.optimize }} --summary all

  fuzz:
    # Seeded fuzz soak with a fresh seed per run; replay a failure with -Dfuzz-seed. Each
    # minifuzz target runs its unsoaked cases, then soaks for at most 30 s.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: seeded fuzz soak
        run: |
          set -o pipefail
          zig build test -Doptimize=ReleaseSafe -Dtest-filter=fuzz -Dfuzz-soak=50 \
            -Dfuzz-soak-budget-s=30 -Dfuzz-seed=$GITHUB_RUN_NUMBER --summary all 2>&1 |
            tee fuzz.log
      - name: upload the failing fuzz log (replay with -Dfuzz-seed=<run number>)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ github.run_number }}-${{ github.run_attempt }}
          path: fuzz.log
