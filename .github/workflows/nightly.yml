name: nightly

# The heaviest tests (-Dslow-tests) in ReleaseSafe: golden DKG rounds and the largest
# conformance hashes, which take minutes each and stay out of the per-push ci.yml jobs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Test filter (-Dtest-filter); empty runs all"
        required: false
        default: ""

jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        # One job ran every package for 136 minutes on x86 (fe3bdcb) and neared the timeout
        # on arm, so it splits like ci.yml: consensus, glue, and the rest, where
        # cryptography's 57 to 90 minutes is the longest step. Most of that is skip_heavy
        # tests (golden DKG rounds, 2 to 3 minutes each), which test-rest and two more
        # cryptography jobs split three ways with -Dheavy-shard.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        job: [consensus, glue, rest, cryptography-1, cryptography-2]
        include:
          - { job: consensus, steps: test-consensus, heavy_shard: 0 }
          - { job: glue, steps: test-glue, heavy_shard: 0 }
          - { job: rest, steps: test-rest, heavy_shard: 0 }
          - { job: cryptography-1, steps: test-cryptography, heavy_shard: 1 }
          - { job: cryptography-2, steps: test-cryptography, heavy_shard: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: slow tests
        env:
          FILTER: ${{ inputs.filter }}
          STEPS: ${{ matrix.steps }}
          SHARD: ${{ matrix.heavy_shard }}
        run: |
          set -- -Doptimize=ReleaseSafe -Dslow-tests -Dheavy-shards=3 -Dheavy-shard="$SHARD"
          if [ -n "$FILTER" ]; then
            zig build "$STEPS" "$@" -Dtest-filter="$FILTER" --summary all
          else
            zig build "$STEPS" "$@" --summary all
          fi
