name: nightly

# The heaviest tests (-Dslow-tests) in ReleaseSafe: golden DKG rounds and the largest
# conformance hashes, which take minutes each and stay out of the per-push ci.yml jobs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Test filter (-Dtest-filter); empty runs all"
        required: false
        default: ""
      only:
        description: "Run only this slow job, such as glue; empty runs all"
        required: false
        default: ""

jobs:
  # Emits the slow jobs' matrix, only the one `only` names when set, so unselected jobs never
  # request a runner (a skipped matrix entry still waits for one).
  matrix:
    if: inputs.only != 'e2e' && inputs.only != 'interop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          ONLY: ${{ inputs.only }}
        # One job ran every package for 136 minutes on x86 (fe3bdcb), so it splits by
        # package. test-consensus alone ran past 2 hours (6ace499), so it splits into groups
        # of test-name filters (etc/scripts/consensus-filters.sh). Cryptography ran 57 to 90
        # minutes, mostly skip_heavy tests (golden DKG rounds, 2 to 3 minutes each), which
        # three cryptography jobs split with -Dheavy-shard. The rest job runs test-others,
        # every other package: with cryptography's first shard it took 62 minutes on arm.
        run: |
          jobs='[
            {"job": "consensus-marshal", "steps": "test-consensus", "group": "marshal"},
            {"job": "consensus-aggregation", "steps": "test-consensus", "group": "aggregation"},
            {"job": "consensus-simplex-engine-1", "steps": "test-consensus",
             "group": "simplex-engine-1"},
            {"job": "consensus-simplex-engine-2", "steps": "test-consensus",
             "group": "simplex-engine-2"},
            {"job": "consensus-simplex-engine-3", "steps": "test-consensus",
             "group": "simplex-engine-3"},
            {"job": "consensus-simplex-fixtures-1", "steps": "test-consensus",
             "group": "simplex-fixtures-1"},
            {"job": "consensus-simplex-fixtures-2", "steps": "test-consensus",
             "group": "simplex-fixtures-2"},
            {"job": "consensus-simplex-fixtures-3", "steps": "test-consensus",
             "group": "simplex-fixtures-3"},
            {"job": "consensus-simplex-fixtures-4", "steps": "test-consensus",
             "group": "simplex-fixtures-4"},
            {"job": "consensus-simplex-twins", "steps": "test-consensus", "group": "simplex-twins"},
            {"job": "consensus-rest", "steps": "test-consensus", "group": "rest"},
            {"job": "glue", "steps": "test-glue"},
            {"job": "rest", "steps": "test-others"},
            {"job": "cryptography-0", "steps": "test-cryptography", "heavy_shard": 0},
            {"job": "cryptography-1", "steps": "test-cryptography", "heavy_shard": 1},
            {"job": "cryptography-2", "steps": "test-cryptography", "heavy_shard": 2}
          ]'
          include=$(echo "$jobs" | jq -c --arg only "$ONLY" '
            [.[] | select($only == "" or .job == $only)
              | (. + {os: "ubuntu-latest"}), (. + {os: "ubuntu-24.04-arm"})]')
          if [ "$include" = "[]" ]; then
            echo "only: no job named $ONLY" >&2
            exit 1
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  slow:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    # About twice the slowest job: arm's third of the fixtures DSTs took 56 minutes on
    # 6e50645, before they split four ways; every other job took 50 or less.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: slow tests
        env:
          FILTER: ${{ inputs.filter }}
          STEPS: ${{ matrix.steps }}
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.heavy_shard || 0 }}
        run: |
          set -- -Doptimize=ReleaseSafe -Dslow-tests -Dheavy-shards=3 -Dheavy-shard="$SHARD"
          if [ -n "$FILTER" ]; then
            set -- "$@" -Dtest-filter="$FILTER"
          elif [ -n "$GROUP" ]; then
            filters=$(sh etc/scripts/consensus-filters.sh "$GROUP")
            while IFS= read -r filter; do set -- "$@" -Dtest-filter="$filter"; done <<EOF
          $filters
          EOF
          fi
          zig build "$STEPS" "$@" --summary all

  # The examples end to end: dkg's bootstrap and validators, bridge's indexer and two
  # networks, and log's validators run locally until every node finalizes the same heights;
  # two chat friends exchange messages; flood's peers report traffic (etc/scripts/e2e.sh).
  e2e:
    if: inputs.only == '' || inputs.only == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: install tmux
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -yq tmux)
      - name: e2e
        env:
          E2E_DIR: ${{ runner.temp }}/e2e
        run: etc/scripts/e2e.sh
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e

  # Live interop with commonware (etc/scripts/interop.sh): its chat, log, dkg, and bridge
  # examples, built from the pinned reference revision, run against zigware's in shared
  # networks. Chat over discovery, simplex log with a restart, simplex's resolver in both
  # directions, a mixed dkg network with a state-syncing joiner of each kind, and two mixed
  # bridge networks bridging each other's certificates through each kind of indexer.
  interop:
    if: inputs.only == '' || inputs.only == 'interop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMMONWARE_REVISION: a9ffc25f3798d555f34461123e09aefb16f01b60
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
          echo "COMMONWARE_REF=$HOME/commonware-ref" >> "$GITHUB_ENV"
          echo "INTEROP_TARGET=$HOME/interop-target" >> "$GITHUB_ENV"
      - name: install tmux and rust
        run: |
          command -v tmux > /dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: checkout commonware
        run: |
          git init -q "$COMMONWARE_REF"
          git -C "$COMMONWARE_REF" fetch -q --depth 1 \
            https://github.com/commonwarexyz/monorepo "$COMMONWARE_REVISION"
          git -C "$COMMONWARE_REF" checkout -q FETCH_HEAD
      # Keyed by revision and the examples built, and saved once the build succeeds, even if
      # interop then fails.
      - name: restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          key: interop-cargo-${{ runner.os }}-${{ env.COMMONWARE_REVISION }}-chat-log-dkg-bridge
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/interop-target
      - name: build commonware's examples
        run: |
          cd "$COMMONWARE_REF"
          cargo fetch --locked
          CARGO_TARGET_DIR="$INTEROP_TARGET" cargo build --release --offline --locked \
            -p commonware-chat -p commonware-log -p commonware-dkg -p commonware-bridge
      - name: save cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: interop-cargo-${{ runner.os }}-${{ env.COMMONWARE_REVISION }}-chat-log-dkg-bridge
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/interop-target
      - name: interop
        env:
          # The drivers keep a failed run's logs and screens under TMPDIR.
          TMPDIR: ${{ runner.temp }}/interop
          # Twice the local default: a runner has four cores to the desktop's many.
          INTEROP_TIMEOUT: 120
        run: |
          set -o pipefail
          mkdir -p "$TMPDIR"
          etc/scripts/interop.sh 2>&1 | tee "$TMPDIR/interop.out"
          # interop.sh exits 0 when it skips, so require its last line.
          grep -qx "interop: ok" "$TMPDIR/interop.out"
      - name: logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: ${{ runner.temp }}/interop
