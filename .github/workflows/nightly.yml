name: nightly

# The heaviest tests (-Dslow-tests) in ReleaseSafe: golden DKG rounds and the largest
# conformance hashes, which take minutes each and stay out of the per-push ci.yml jobs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Test filter (-Dtest-filter); empty runs all"
        required: false
        default: ""

jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        # One job ran every package for 136 minutes on x86 (fe3bdcb) and neared the timeout
        # on arm, so it splits like ci.yml: consensus, glue, and the rest, where
        # cryptography's 57 minutes is the longest step.
        os: [ubuntu-latest, ubuntu-24.04-arm]
        steps: [test-consensus, test-glue, test-rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: slow tests
        env:
          FILTER: ${{ inputs.filter }}
          STEPS: ${{ matrix.steps }}
        run: |
          if [ -n "$FILTER" ]; then
            zig build "$STEPS" -Doptimize=ReleaseSafe -Dslow-tests -Dtest-filter="$FILTER" \
              --summary all
          else
            zig build "$STEPS" -Doptimize=ReleaseSafe -Dslow-tests --summary all
          fi
