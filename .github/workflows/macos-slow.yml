name: macos-slow

# The slow tests (-Dslow-tests) on macOS, run by hand: Debug by default, so failures keep
# stack traces; ReleaseSafe reproduces the CI step whose TCP stress test once leaked.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Test filter (-Dtest-filter), such as production.network; empty runs all"
        required: false
        default: ""
      optimize:
        description: "Build mode (-Doptimize)"
        required: false
        default: Debug
        type: choice
        options: [Debug, ReleaseSafe, ReleaseFast]

jobs:
  slow:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: limits
        run: |
          ulimit -a
          sysctl kern.ipc.somaxconn kern.maxfilesperproc kern.num_taskthreads
      - name: slow tests
        env:
          FILTER: ${{ inputs.filter }}
          OPTIMIZE: ${{ inputs.optimize }}
        run: |
          if [ -n "$FILTER" ]; then
            zig build test -Dslow-tests -Doptimize="$OPTIMIZE" -Dtest-filter="$FILTER" --summary all
          else
            zig build test -Dslow-tests -Doptimize="$OPTIMIZE" --summary all
          fi
