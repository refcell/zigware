name: macos

# macOS runners are scarce: let the running build finish and keep only the newest push
# waiting behind it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    # Debug and ReleaseSafe back to back no longer fit in 30 minutes, so every run was cut
    # off; per push, macOS runs Debug only, and the Linux jobs cover ReleaseSafe.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: test
        run: zig build test --summary all
