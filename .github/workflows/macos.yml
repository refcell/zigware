name: macos

# macOS runners are scarce: let the running build finish and keep only the newest push
# waiting behind it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # One job running every package hit the 60-minute limit on every run. On a 6-core Mac,
    # storage alone takes about 26 minutes, consensus 10, glue 6, cryptography 5, and the
    # rest (test-light) a few, so they split into four jobs. All run Debug; the Linux jobs
    # cover ReleaseSafe.
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: storage
            steps: test-storage
          - job: consensus
            steps: test-consensus
          - job: glue-cryptography
            steps: test-glue test-cryptography
          - job: light
            steps: test-light
    name: test (${{ matrix.job }})
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install zig
        run: |
          sh etc/scripts/install-zig.sh "$HOME/zig"
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: test
        run: zig build ${{ matrix.steps }} --summary all
